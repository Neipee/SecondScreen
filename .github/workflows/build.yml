name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SecondScreen.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest SecondScreen.apk \
            --title "SecondScreen build #${{ github.run_number }} ($(date -u +'%d/%m/%Y %H:%M') UTC)" \
            --notes "APK debug compilé automatiquement depuis main (commit ${GITHUB_SHA::7}). Télécharger SecondScreen.apk." \
            --target "$GITHUB_SHA" --latest
